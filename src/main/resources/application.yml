server:
  port: ${SERVER_PORT:8101}

spring:
  application:
    name: flashsale-order-inventory-api
  threads:
    virtual:
      enabled: true
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-before-production-use-at-least-32-chars}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  order:
    reservation-ttl-seconds: ${ORDER_RESERVATION_TTL_SECONDS:900}
  scheduler:
    reservation-expiry:
      enabled: ${ORDER_EXPIRY_JOB_ENABLED:true}
      delay-ms: ${ORDER_EXPIRY_JOB_DELAY_MS:30000}
      batch-size: 50
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    order-checkout:
      capacity: ${RATE_LIMIT_ORDER_CAPACITY:35}
      refill-tokens: ${RATE_LIMIT_ORDER_REFILL_TOKENS:35}
      refill-period-seconds: ${RATE_LIMIT_ORDER_REFILL_PERIOD_SECONDS:60}
    voucher-claim:
      capacity: ${RATE_LIMIT_VOUCHER_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_VOUCHER_REFILL_TOKENS:5}
      refill-period-seconds: ${RATE_LIMIT_VOUCHER_REFILL_PERIOD_SECONDS:10}
