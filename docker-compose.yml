services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-flashsale}
      POSTGRES_USER: ${DB_USERNAME:-flashsale}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-flashsale}
    ports:
      - "${POSTGRES_PORT:-5431}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flashsale} -d ${DB_NAME:-flashsale}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8101
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flashsale}
      DB_USERNAME: ${DB_USERNAME:-flashsale}
      DB_PASSWORD: ${DB_PASSWORD:-flashsale}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-change-before-production-32chars}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
    ports:
      - "${SERVER_PORT:-8101}:8101"

volumes:
  postgres_data:
